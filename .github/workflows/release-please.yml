name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; each job widens only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only this job manages release PRs/issues.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    # Gate the minisign signing key behind a protected GitHub Environment: only runs of
    # this job (not an arbitrary push/PR workflow) can reference MINISIGN_SECRET_KEY, and
    # the environment's protection rules (required reviewer / tag restriction) apply.
    # Configure the secret on the `release` environment in repo settings.
    environment: release
    # Only needs to upload release assets — not issues/PR write.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Two rungs per architecture: a baseline artifact that runs anywhere, and a tuned
        # one with hardware AES. Every relayed byte passes through AES-CTR twice, so the
        # baseline rung relays with std's bitsliced software AES and is CPU-bound under load.
        # aarch64 had only the baseline rung: `generic` carries `fuse_aes` (a scheduling
        # hint) but not the `aes` feature, so every published ARM binary used software AES
        # with no artifact an operator could switch to. `generic+aes` needs the ARMv8 crypto
        # extensions — present on every ARM server part (Graviton, Ampere, Neoverse, Apple),
        # absent on Cortex-A72 — hence a separate `_crypto` artifact rather than making the
        # only aarch64 download require them.
        include:
          - target: x86_64-linux
            artifact_name: mtproto-proxy-linux-x86_64
            binary: mtproto-proxy
            cpu: ""
          - target: x86_64-linux
            artifact_name: mtproto-proxy-linux-x86_64_v3
            binary: mtproto-proxy
            cpu: x86_64_v3+aes
          - target: aarch64-linux
            artifact_name: mtproto-proxy-linux-aarch64
            binary: mtproto-proxy
            cpu: ""
          - target: aarch64-linux
            artifact_name: mtproto-proxy-linux-aarch64_crypto
            binary: mtproto-proxy
            cpu: generic+aes
          - target: x86_64-linux
            artifact_name: mtbuddy-linux-x86_64
            binary: mtbuddy
            cpu: ""
          - target: x86_64-linux
            artifact_name: mtbuddy-linux-x86_64_v3
            binary: mtbuddy
            cpu: x86_64_v3+aes
          - target: aarch64-linux
            artifact_name: mtbuddy-linux-aarch64
            binary: mtbuddy
            cpu: ""
          # mtbuddy gains nothing from AES itself, but release.zig derives the buddy asset
          # name from the proxy asset it picked, so the tuned rung needs a matching buddy or
          # mtbuddy's own self-update finds no download.
          - target: aarch64-linux
            artifact_name: mtbuddy-linux-aarch64_crypto
            binary: mtbuddy
            cpu: generic+aes

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      # Runs for every leg that pins a CPU, not just x86_64_v3: a tuned artifact whose name
      # promises hardware AES but whose -Dcpu does not actually select it is invisible at
      # runtime (std silently falls back to the bitsliced software AES) and is exactly the
      # trap `x86_64+aes` fell into — std needs aes AND avx on x86, so `+aes` alone builds
      # soft AES. The baseline legs (cpu: "") are software-AES on purpose and are skipped.
      - name: Verify the pinned CPU profile really enables hardware AES
        if: matrix.cpu != ''
        run: |
          cat > /tmp/check_aes_target.zig <<'EOF'
          const std = @import("std");

          comptime {
              if (!std.crypto.core.aes.has_hardware_support) {
                  @compileError("tuned release artifacts must be built with a hardware-AES cpu");
              }
          }

          pub fn main() void {}
          EOF
          zig build-exe -target "${{ matrix.target }}" -mcpu "${{ matrix.cpu }}" /tmp/check_aes_target.zig

      - name: Build release binary
        run: |
          PINNED_MINISIGN_PUBKEY="RWT8YwmUuq/3WpUnYJjD6rAfQugYdZKWr61U3O+2kdNvriLSyrvVU/NO"
          BUILD_ARGS="-Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}"
          if [ -n "${{ matrix.cpu }}" ]; then
            BUILD_ARGS="$BUILD_ARGS -Dcpu=${{ matrix.cpu }}"
          fi
          BUILD_ARGS="$BUILD_ARGS -Dminisign_pubkey=${PINNED_MINISIGN_PUBKEY}"
          zig build $BUILD_ARGS

      - name: Package artifact
        run: |
          mkdir -p dist
          cp zig-out/bin/${{ matrix.binary }} dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          tar -C dist -czf dist/${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          (
            cd dist
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          )

      - name: Sign checksum with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          PINNED_MINISIGN_PUBKEY="RWT8YwmUuq/3WpUnYJjD6rAfQugYdZKWr61U3O+2kdNvriLSyrvVU/NO"
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "MINISIGN_SECRET_KEY is required for release signing"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y minisign

          umask 077
          signing_key="$(mktemp "$RUNNER_TEMP/minisign.XXXXXX")"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$signing_key"
          printf '%s\n' "untrusted comment: mtproto.zig minisign public key" > dist/minisign.pub
          printf '%s\n' "${PINNED_MINISIGN_PUBKEY}" >> dist/minisign.pub
          minisign -S \
            -s "$signing_key" \
            -m dist/${{ matrix.artifact_name }}.tar.gz.sha256 \
            -x dist/${{ matrix.artifact_name }}.tar.gz.sha256.minisig \
            -t "tag:${{ needs.release-please.outputs.tag_name }} artifact:${{ matrix.artifact_name }}"
          minisign -V \
            -q \
            -m dist/${{ matrix.artifact_name }}.tar.gz.sha256 \
            -x dist/${{ matrix.artifact_name }}.tar.gz.sha256.minisig \
            -P "${PINNED_MINISIGN_PUBKEY}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only this leg's own (unique) artifacts — minisign.pub is shared and is uploaded
          # once by the publish-pubkey job, so parallel legs never race to --clobber it.
          FILES=(
            "dist/${{ matrix.artifact_name }}.tar.gz"
            "dist/${{ matrix.artifact_name }}.tar.gz.sha256"
            "dist/${{ matrix.artifact_name }}.tar.gz.sha256.minisig"
          )
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${FILES[@]}" \
            --clobber

  publish-pubkey:
    # The minisign public key is identical for every artifact. Uploading it from each of the
    # 6 matrix legs made them race to --clobber the same asset; the loser hit HTTP 404/422
    # and (v1.4.2) that failure dropped a whole build leg's artifacts from the release. Upload
    # it exactly once, after all legs finish.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please, build-and-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload minisign public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PINNED_MINISIGN_PUBKEY="RWT8YwmUuq/3WpUnYJjD6rAfQugYdZKWr61U3O+2kdNvriLSyrvVU/NO"
          printf '%s\n' "untrusted comment: mtproto.zig minisign public key" > minisign.pub
          printf '%s\n' "${PINNED_MINISIGN_PUBKEY}" >> minisign.pub
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            minisign.pub \
            --repo "${{ github.repository }}" \
            --clobber
